[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "astro-polars"
dynamic = ["version"]
description = "Astronomy on Polars: cross-matching, sky selections, HEALPix, frame rotations and sky maps for large catalogues."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "Eduardo Balbinot" }]
keywords = ["astronomy", "polars", "gaia", "healpix", "crossmatch", "euclid", "lsst", "catalogue"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = [
  "polars>=1.30",
  "numpy>=1.22",
  "numba>=0.58",
  "scikit-learn>=1.3",
  "hpgeom>=1.2",
]

[project.optional-dependencies]
viz = ["matplotlib>=3.8", "skyproj>=2.0"]
fits = ["astropy>=5.0"]
all = ["astro-polars[viz,fits]"]
test = ["pytest>=7"]
docs = ["mkdocs-material>=9.5", "mkdocstrings[python]>=0.26"]
dev = ["astro-polars[all,test,docs]", "ruff", "build"]

[project.urls]
Homepage = "https://github.com/balbinot/astro-polars"
Documentation = "https://balbinot.github.io/astro-polars/"
Source = "https://github.com/balbinot/astro-polars"
Issues = "https://github.com/balbinot/astro-polars/issues"

[tool.hatch.version]
path = "src/astro_polars/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/astro_polars"]

[tool.hatch.build.targets.sdist]
include = ["src/astro_polars", "tests", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "UP007", "UP006", "UP035", "UP045", "B008", "B905"]
